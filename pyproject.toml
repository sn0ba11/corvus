[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "osint-workbench"
version = "0.2.0-rc13"
description = "Local adapter-driven OSINT investigation workbench"
requires-python = ">=3.12"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "COPYRIGHT", "THIRD_PARTY_NOTICES.md", "LICENSES/*"]
dependencies = [
  "alembic==1.16.4", "defusedxml==0.7.1", "fastapi==0.139.2", "httpx==0.28.1", "jinja2==3.1.6", "mako>=1.4.2",
  "pydantic-settings==2.10.1", "python-multipart==0.0.32", "sqlalchemy==2.0.41", "starlette==1.3.1",
  "uvicorn[standard]==0.35.0", "itsdangerous==2.2.0", "pillow==13.0.0", "certifi==2026.10.18",
  "numpy==2.4.2", "opencv-python-headless==4.13.0.92", "socksio==1.0.0", "markdown-it-py==4.2.0",
]

[project.optional-dependencies]
dev = [
  "mypy==1.17.0", "pip-audit==2.10.1", "pynacl==1.6.2", "pytest==9.1.1",
  "pytest-asyncio==1.4.0", "pytest-cov==6.2.1", "ruff==0.12.5",
  # Pin security fixes in the audit tooling's transitive dependencies as well.
  "filelock==4.2.1", "msgpack==1.2.3", "urllib3==2.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
markers = ["live: manually invoked tests requiring external network access"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP", "ASYNC"]
ignore = ["S101", "E501", "B008", "ASYNC109"]

[tool.ruff.lint.per-file-ignores]
"app/adapters/base.py" = ["S108"]
"tool_containers/runner.py" = ["S104", "S108", "S603"]
"scripts/start.py" = ["S104", "S606", "S607"]
"scripts/download_face_models.py" = ["S310"]
"scripts/installer.py" = ["S603"]
"scripts/smoke_test.py" = ["S310"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = "migrations"
