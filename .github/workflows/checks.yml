name: Checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: 0.11.28
          enable-cache: false
      - run: uv sync --locked --extra dev --python 3.12
      - run: uv run --locked --extra dev ruff check .
      - run: uv run --locked --extra dev mypy app browser_agent scripts
      - name: Audit locked Python dependencies
        run: |
          uv export --locked --no-emit-project --extra dev --format requirements-txt --output-file "$RUNNER_TEMP/corvus-requirements.txt"
          uv run --locked --extra dev pip-audit --strict --require-hashes -r "$RUNNER_TEMP/corvus-requirements.txt"
      - run: uv run --locked --extra dev pytest -m 'not live'
      - run: uv run --locked --extra dev pytest examples/collector-template/test_adapter.py
      - run: uv build --wheel
      - run: git diff --exit-code
      - run: git diff-tree --root --check --no-commit-id -r HEAD
