name: Build release packages

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified assets to GitHub Releases
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  gate:
    if: github.ref_type == 'tag' && github.repository == 'sn0ba11/corvus'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: 0.11.28
          enable-cache: false
      - name: Verify version and source branch
        run: |
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          uv run --locked --python 3.12 python -c 'import os, tomllib; from pathlib import Path; assert os.environ["GITHUB_REF_NAME"] == "v" + tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]'
      - run: uv run --locked --extra dev ruff check .
      - run: uv run --locked --extra dev mypy app browser_agent scripts
      - name: Audit locked Python dependencies
        run: |
          uv export --locked --no-emit-project --extra dev --format requirements-txt --output-file "$RUNNER_TEMP/corvus-requirements.txt"
          uv run --locked --extra dev pip-audit --strict --require-hashes -r "$RUNNER_TEMP/corvus-requirements.txt"
      - run: uv run --locked --extra dev pytest -m 'not live'
      - run: uv build --wheel

  security:
    needs: gate
    uses: ./.github/workflows/security.yml

  windows:
    needs: gate
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: git branch -f main HEAD
      - name: Install NSIS and test the Windows launcher
        shell: pwsh
        run: |
          choco install nsis --version 3.11 -y --no-progress
          powershell.exe -NoLogo -NoProfile -STA -ExecutionPolicy Bypass -File .\tests\windows\Test-CorvusUpdateGUI.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows updater regression failed.' }
      - name: Build Windows installer
        shell: pwsh
        run: .\Build-WindowsInstaller.ps1 -Version $env:GITHUB_REF_NAME.Substring(1) -OutputDirectory .\dist\release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release
          path: dist/release/
          if-no-files-found: error

  macos:
    needs: gate
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: git branch -f main HEAD
      - name: Build and validate macOS archive
        shell: zsh {0}
        run: |
          for script in *.command installer/macos/*.sh; do zsh -n "$script" || exit; done
          ./Build-macOS-Package.sh "${GITHUB_REF_NAME#v}"
          unzip -t dist/release/*.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-release
          path: dist/release/
          if-no-files-found: error

  updater:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python scripts/build_updater.py --output dist/updater
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: updater-release
          path: dist/updater/
          if-no-files-found: error

  verify-assets:
    needs: [windows, macos, updater, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: "*-release"
          merge-multiple: true
          path: release-assets
      - name: Verify release assets
        working-directory: release-assets
        run: |
          set -euo pipefail
          shopt -s nullglob
          windows=(Corvus-*-Setup.exe)
          macos=(OSINT-Workbench-*-macOS.zip)
          updater=(Corvus-Updater-*.zip)
          test "${#windows[@]}" -eq 1
          test "${#macos[@]}" -eq 1
          test "${#updater[@]}" -eq 1
          for asset in "${windows[0]}" "${macos[0]}" "${updater[0]}"; do
            read -r expected _ < "$asset.sha256"
            test "$expected" = "$(sha256sum "$asset" | cut -d ' ' -f 1)"
          done
          unzip -t "${macos[0]}"
          unzip -t "${updater[0]}"
          unzip -Z1 "${macos[0]}" > macos-file-list.txt
          unzip -Z1 "${updater[0]}" > updater-file-list.txt
          for notice in LICENSE COPYRIGHT THIRD_PARTY_NOTICES.md LICENSES/HTMX.txt LICENSES/AGPL-3.0.txt; do
            grep -Fx "${macos[0]%.zip}/$notice" macos-file-list.txt
            grep -Fx "$notice" updater-file-list.txt
          done
          rm macos-file-list.txt updater-file-list.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-assets
          path: release-assets/
          if-no-files-found: error

  publish:
    if: inputs.publish
    needs: verify-assets
    environment: public-release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-assets
          path: release-assets
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          options=()
          if [[ "$GITHUB_REF_NAME" == *-rc* ]]; then options+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag \
            --repo "$GITHUB_REPOSITORY" --title "Corvus ${GITHUB_REF_NAME#v}" \
            --notes-file release-assets/RELEASE_NOTES.md "${options[@]}"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir read-back
          diff -rq release-assets read-back
