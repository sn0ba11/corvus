name: Security review

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  filesystem:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build local redistributable-source stack
        shell: bash
        run: |
          python3 -c 'from scripts.installer import ensure_env; ensure_env()'
          docker compose build
      - name: Check the isolated stack starts
        run: |
          for volume in workbench-data browser-profile browser-evidence; do
            docker volume create "osint-workbench_${volume}"
          done
          docker compose up -d --no-build --wait --wait-timeout 150
          curl --fail --silent --show-error http://127.0.0.1:8000/readyz
      - name: Stop the test stack
        if: always()
        run: docker compose down
      - uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.76.2
      - name: Scan all default service images
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t images < <(docker compose config --images | sort -u)
          test "${#images[@]}" -gt 0
          status=0
          for image in "${images[@]}"; do
            report="$RUNNER_TEMP/${image%:*}.json"
            trivy image --image-src docker --scanners vuln,secret --severity HIGH,CRITICAL \
              --format json --output "$report" "$image"
            python3 scripts/check_container_scan.py "$image" "$report" || status=1
          done
          exit "$status"
